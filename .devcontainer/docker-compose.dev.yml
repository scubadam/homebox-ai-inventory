services:
  app:
    image: ${GO_DEV_IMAGE:-golang:1.26-bookworm}
    working_dir: /workspace
    volumes:
      - ..:/workspace:cached
      - go-cache:/go/pkg/mod
    environment:
      - PORT=8000
      - HOMEBOX_URL=http://homebox-test:7745
      - HOMEBOX_PUBLIC_URL=http://localhost:7745
      - AI_PROVIDER=gemini
    command: sleep infinity
    depends_on:
      - homebox-test

  homebox-test:
    image: ${HOMEBOX_TEST_IMAGE:-ghcr.io/sysadminsmedia/homebox:latest}
    restart: unless-stopped
    environment:
      - HBOX_LOG_LEVEL=info
      - HBOX_LOG_FORMAT=text
      - HBOX_WEB_MAX_UPLOAD_SIZE=25
      - HBOX_OPTIONS_ALLOW_REGISTRATION=true
      - HBOX_AUTH_API_KEY_PEPPER=dGVzdC1wZXBwZXItYXRfbGVhc3RfMzJfYnl0ZXNfbG9uZ19mb3JfdGVzdGluZ19wdXJwb3Nlcwo=
    ports:
      - "7745:7745"

volumes:
  go-cache:
