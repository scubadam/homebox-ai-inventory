{{- if and .Values.auth.enabled .Values.auth.externalSecret.enabled -}}
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: {{ include "homebox-ai-inventory.fullname" . }}-password-gen
  labels:
    {{- include "homebox-ai-inventory.labels" . | nindent 4 }}
spec:
  length: {{ .Values.auth.externalSecret.passwordLength | default 24 }}
  digits: 5
  symbols: 0
  noUpper: false
  allowRepeat: true
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "homebox-ai-inventory.fullname" . }}-auth
  labels:
    {{- include "homebox-ai-inventory.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.auth.externalSecret.refreshInterval | default "1h" }}
  target:
    name: {{ include "homebox-ai-inventory.fullname" . }}-auth
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        {{ .Values.auth.usernameKey | default "username" }}: {{ .Values.auth.externalSecret.username | default "admin" | quote }}
        {{ .Values.auth.passwordKey | default "password" }}: "{{ "{{" }} .generatedPassword {{ "}}" }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: {{ include "homebox-ai-inventory.fullname" . }}-password-gen
{{- end }}
