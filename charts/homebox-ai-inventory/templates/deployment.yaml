apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "homebox-ai-inventory.fullname" . }}
  labels:
    {{- include "homebox-ai-inventory.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "homebox-ai-inventory.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "homebox-ai-inventory.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          env:
            - name: PORT
              value: {{ .Values.service.port | quote }}
            - name: HOMEBOX_URL
              value: {{ .Values.homebox.url | quote }}
            - name: HOMEBOX_PUBLIC_URL
              value: {{ .Values.homebox.publicUrl | default .Values.homebox.url | quote }}
            - name: AI_PROVIDER
              value: {{ .Values.ai.provider | quote }}
            - name: AI_MODEL
              value: {{ .Values.ai.model | quote }}
            {{- if .Values.ai.baseUrl }}
            - name: AI_BASE_URL
              value: {{ .Values.ai.baseUrl | quote }}
            {{- end }}
            - name: AI_TIMEOUT_SECONDS
              value: {{ .Values.ai.timeoutSeconds | quote }}
            - name: MAX_IMAGE_DIMENSION
              value: {{ .Values.imaging.maxDimension | quote }}
            - name: JPEG_QUALITY
              value: {{ .Values.imaging.jpegQuality | quote }}
            {{- if .Values.secrets.homeboxApiKeySecret.name }}
            - name: HOMEBOX_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.homeboxApiKeySecret.name }}
                  key: {{ .Values.secrets.homeboxApiKeySecret.key | default "HOMEBOX_API_KEY" }}
            {{- end }}
            {{- if .Values.secrets.homeboxUsernameSecret.name }}
            - name: HOMEBOX_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.homeboxUsernameSecret.name }}
                  key: {{ .Values.secrets.homeboxUsernameSecret.key | default "HOMEBOX_USERNAME" }}
            {{- end }}
            {{- if .Values.secrets.homeboxPasswordSecret.name }}
            - name: HOMEBOX_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.homeboxPasswordSecret.name }}
                  key: {{ .Values.secrets.homeboxPasswordSecret.key | default "HOMEBOX_PASSWORD" }}
            {{- end }}
            {{- if .Values.secrets.aiApiKeySecret.name }}
            - name: AI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.aiApiKeySecret.name }}
                  key: {{ .Values.secrets.aiApiKeySecret.key | default "AI_API_KEY" }}
            {{- end }}
            {{- if .Values.auth.enabled }}
            - name: AUTH_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ if .Values.auth.existingSecret }}{{ .Values.auth.existingSecret }}{{ else }}{{ include "homebox-ai-inventory.fullname" . }}-auth{{ end }}
                  key: {{ .Values.auth.usernameKey | default "username" }}
            - name: AUTH_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ if .Values.auth.existingSecret }}{{ .Values.auth.existingSecret }}{{ else }}{{ include "homebox-ai-inventory.fullname" . }}-auth{{ end }}
                  key: {{ .Values.auth.passwordKey | default "password" }}
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- $hasEnvFrom := or .Values.secrets.existingSecret .Values.secrets.extraSecretRefs .Values.extraEnvFrom }}
          {{- if $hasEnvFrom }}
          envFrom:
            {{- if .Values.secrets.existingSecret }}
            - secretRef:
                name: {{ .Values.secrets.existingSecret }}
                optional: true
            {{- end }}
            {{- range .Values.secrets.extraSecretRefs }}
            - secretRef:
                name: {{ . }}
            {{- end }}
            {{- with .Values.extraEnvFrom }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
