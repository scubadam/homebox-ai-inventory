{{- if and (not .Values.secrets.existingSecret) (or .Values.secrets.homeboxApiKey .Values.secrets.aiApiKey .Values.secrets.homeboxUsername) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "homebox-ai-inventory.fullname" . }}
  labels:
    {{- include "homebox-ai-inventory.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if .Values.secrets.homeboxApiKey }}
  HOMEBOX_API_KEY: {{ .Values.secrets.homeboxApiKey | quote }}
  {{- end }}
  {{- if .Values.secrets.homeboxUsername }}
  HOMEBOX_USERNAME: {{ .Values.secrets.homeboxUsername | quote }}
  {{- end }}
  {{- if .Values.secrets.homeboxPassword }}
  HOMEBOX_PASSWORD: {{ .Values.secrets.homeboxPassword | quote }}
  {{- end }}
  {{- if .Values.secrets.aiApiKey }}
  AI_API_KEY: {{ .Values.secrets.aiApiKey | quote }}
  {{- end }}
{{- end }}
