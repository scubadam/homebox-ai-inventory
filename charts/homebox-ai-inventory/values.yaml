replicaCount: 1

image:
  repository: ghcr.io/scubadam/homebox-ai-inventory
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# Configuration for the Homebox backend
homebox:
  # Internal URL of your Homebox instance inside or outside the cluster
  url: "http://homebox.homebox.svc.cluster.local:7745"
  # Public user-facing URL of Homebox (used in PWA for direct links to items)
  publicUrl: ""

# AI Vision Provider settings
ai:
  # Provider: "gemini" (default), "ollama", "openai", or "anthropic"
  provider: "gemini"
  # Model identifier (e.g. "gemini-2.5-flash", "llava-phi3", "gpt-4o-mini")
  model: "gemini-2.5-flash"
  # Optional custom base URL (e.g., http://ollama-service.default.svc.cluster.local:11434)
  baseUrl: ""
  # Request timeout in seconds
  timeoutSeconds: 60

# Secret Configuration (API Keys & Credentials)
secrets:
  # Option 1: Existing single secret containing HOMEBOX_API_KEY (or HOMEBOX_USERNAME/PASSWORD) and AI_API_KEY
  existingSecret: ""

  # Option 2: Additional secrets to inject via envFrom (e.g. if Homebox and AI keys are in separate secrets)
  extraSecretRefs: []

  # Option 3: Granular secretKeyRefs for custom secret names and keys
  homeboxApiKeySecret:
    name: ""
    key: "HOMEBOX_API_KEY"
  homeboxUsernameSecret:
    name: ""
    key: "HOMEBOX_USERNAME"
  homeboxPasswordSecret:
    name: ""
    key: "HOMEBOX_PASSWORD"
  aiApiKeySecret:
    name: ""
    key: "AI_API_KEY"

  # Option 4: Plain-text values to be created as a Kubernetes Secret by this chart (for dev/testing)
  homeboxApiKey: ""
  homeboxUsername: ""
  homeboxPassword: ""
  aiApiKey: ""

# Additional environment variables to inject
extraEnv: []
# - name: MY_CUSTOM_VAR
#   value: "foo"

# Additional envFrom sources to inject
extraEnvFrom: []

# Image processing settings
imaging:
  maxDimension: 1600
  jpegQuality: 85

serviceAccount:
  create: false
  name: ""

podAnnotations: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  port: 8000
  annotations: {}

# Ingress Configuration (Standard Kubernetes Ingress)
ingress:
  enabled: false
  className: ""
  annotations: {}
    # Example cert-manager configuration:
    # cert-manager.io/cluster-issuer: letsencrypt-prod
  hosts:
    - host: inventory.local
      paths:
        - path: /
          pathType: Prefix
  tls: []
    # Example TLS configuration:
    # - secretName: inventory-tls
    #   hosts:
    #     - inventory.local

# Kubernetes Gateway API (HTTPRoute)
# For modern clusters using Gateway API (Traefik, Cilium, Envoy Gateway, Istio)
httpRoute:
  enabled: false
  annotations: {}
  parentRefs:
    - name: default-gateway
      namespace: default
      sectionName: https
  hostnames:
    - "inventory.local"

# Standalone cert-manager Certificate resource
# For generating TLS certificates independently of Ingress (e.g. for Gateway API or internal PKI)
certificate:
  enabled: false
  annotations: {}
  secretName: ""
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
    - inventory.local

resources:
  limits:
    cpu: 500m
    memory: 256Mi
  requests:
    cpu: 20m
    memory: 64Mi

livenessProbe:
  httpGet:
    path: /api/health
    port: http
  initialDelaySeconds: 5
  periodSeconds: 20
  timeoutSeconds: 3

readinessProbe:
  httpGet:
    path: /api/health
    port: http
  initialDelaySeconds: 2
  periodSeconds: 10
  timeoutSeconds: 3

nodeSelector: {}
tolerations: []
affinity: {}
